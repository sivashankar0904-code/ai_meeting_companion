[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-meeting-companion"
version = "0.1.0"
description = "AI meeting overlay for Windows and macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyqt6>=6.7",
    "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0",
    "mss>=9.0",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "pynput>=1.7.6",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "numpy>=1.26",
    "python-dotenv>=1.2.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# NVIDIA GPU speech recognition (Windows): uv pip install -e ".[gpu]"
build = ["pyinstaller>=6"]
gpu = ["nvidia-cublas-cu12; sys_platform == 'win32'", "nvidia-cudnn-cu12; sys_platform == 'win32'"]

[project.scripts]
ai-meeting-companion = "ai_meeting_companion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_meeting_companion = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the running Postgres from .env"]
addopts = "-m 'not db'"
